version: "1.0"
apps:
  - id: 7zip
    manager: scoop
  - id: Git.Git
    manager: winget
  - id: wget
    manager: choco
  - id: "tpope/vim-fugitive"
    manager: "vim"
envVars:
  - variable: "WDEM_TEST"
    value: "true"
    action: "set"
registryTweaks:
  - path: 'HKCU\Software\WDEMTest'
    name: "TestValue"
    value: 123
    type: "dword"
systemSettings:
  show_file_extensions: true
git:
  userName: "WDEM Test"
  userEmail: "test@wdem.local"
  settings:
    init.defaultBranch: main
extensions:
  vim:
    settings:
      number: true
