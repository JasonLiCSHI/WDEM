version: "1.0"
apps:
  - id: 7zip.7zip
    manager: winget
  - id: neovim
    manager: chocolatey
envVars:
  - variable: "WDEM_TEST_GHA"
    value: "true"
    action: "set"
dotfiles:
  - src: "README.md"
    target: "~/test-dotfile-gha.md"
registryTweaks:
  - path: 'HKCU\Software\WDEMGHA'
    name: "GHATest"
    value: 456
    type: "dword"
systemSettings:
  show_file_extensions: true
git:
  userName: "WDEM GHA"
  userEmail: "gha@wdem.local"
extensions:
  starship:
    settings:
      add_newline: false
  bat:
    settings:
      theme: "TwoDark"
  fzf:
    settings:
      default_options: "--height 40% --layout=reverse"
  ripgrep:
    settings:
      max_columns: 150
  zoxide:
    settings:
      cmd: "z"


