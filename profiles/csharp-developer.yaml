schemaVersion: "1.0"
profile:
  id: csharp-developer
  version: 1.0.0
  displayName: C# Developer
  description: Standard C# and .NET development environment
  requiredResources:
    - id: visual-studio
      versionConstraint: ">=18.3 <19.0"
      preferredVersion: "18.3.2"
    - id: dotnet-sdk
      versionConstraint: "10.0.x"
    - id: git
      versionConstraint: ">=2.50"
  optionalResources:
    - id: resharper
      versionConstraint: "2026.1.x"
      defaultSelected: false
    - id: resharper-settings
      defaultSelected: false
    - id: company-vs-extension
      versionConstraint: "3.2.x"
      defaultSelected: false
    - id: visual-studio-settings
      defaultSelected: false
resources:
  visual-studio:
    displayName: Visual Studio Community
    description: Integrated development environment for .NET desktop development
    type: visual-studio
    provider: visual-studio
    parameters:
      productId: Microsoft.VisualStudio.Product.Community
      edition: Community
      channelId: VisualStudio.18.Release
      workloads: Microsoft.VisualStudio.Workload.ManagedDesktop
      components: Microsoft.VisualStudio.Component.CoreEditor,Microsoft.VisualStudio.Component.Roslyn.Compiler,Microsoft.Net.Component.4.8.1.TargetingPack
      vsconfigPath: profiles/assets/csharp-developer.vsconfig
      expectedSha256: 8026BB860A0B8A31979F7706601CD23D0F3265A42D39EAAD023AA701A1CC5894
      bootstrapperUri: https://c2rsetup.officeapps.live.com/c2r/downloadVS.aspx?sku=community&channel=stable&version=VS18&source=WDEM&cid=2500
      bootstrapperSha256: 2D22F8E6B43DD723CC59E37CDE9DD22CAD778178F8C31F0300CE945C5C76A5E1
  dotnet-sdk:
    displayName: .NET SDK
    description: SDK and command-line tools for building .NET applications
    type: dotnet-sdk
    provider: winget
  git:
    displayName: Git
    description: Distributed version control command-line tools
    type: git
    provider: winget
  resharper:
    displayName: ReSharper
    description: JetBrains productivity and code-quality tools for Visual Studio
    type: resharper
    provider: winget
    dependsOn:
      - visual-studio
    parameters:
      productId: Microsoft.VisualStudio.Product.Community
      edition: Community
      channelId: VisualStudio.18.Release
  resharper-settings:
    displayName: ReSharper settings
    description: Shared ReSharper settings for the C# developer environment
    type: resharper-settings
    provider: file
    dependsOn:
      - resharper
    parameters:
      sourcePath: profiles/assets/csharp-developer.DotSettings
      expectedSha256: 4B9EBCC4DD86B8DBB6F337E45160E1A4FD09DA04A04723A4E4ACC601CEBCAFFC
      destinationPath: Shared/vAny/GlobalSettingsStorage.DotSettings
  company-vs-extension:
    displayName: Company Visual Studio extension
    description: Approved internal Visual Studio extension supplied by the organization
    type: visual-studio-extension
    provider: vsix
    privilegeRequirement: Administrator
    dependsOn:
      - visual-studio
    parameters:
      extensionId: Company.VisualStudio.Extension
      productId: Microsoft.VisualStudio.Product.Community
      edition: Community
      channelId: VisualStudio.18.Release
      sourcePath: ${WDEM_COMPANY_VSIX_PATH}
      expectedSha256: ${WDEM_COMPANY_VSIX_SHA256}
  visual-studio-settings:
    displayName: Visual Studio settings
    description: Shared Visual Studio preferences for the C# developer environment
    type: visual-studio-settings
    provider: visual-studio-settings
    dependsOn:
      - visual-studio
    parameters:
      sourcePath: profiles/assets/csharp-developer.vssettings
      expectedSha256: 1C15AC04C11C2E5FA6B2003D5AF145CC47332B9284EA1E391876FF46000627AB
      productId: Microsoft.VisualStudio.Product.Community
      edition: Community
      channelId: VisualStudio.18.Release
      settingsStorePath: Settings/csharp-developer.vssettings
