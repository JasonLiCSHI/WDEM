name: WDEM product release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  wdem-release:
    name: Build WDEM product distribution
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag_name || github.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Restore WDEM
      run: dotnet restore Wdem.sln -m:1 -p:EnableWindowsTargeting=true

    - name: Test WDEM
      run: dotnet test Wdem.sln --no-restore -c Release --verbosity normal -m:1 -p:EnableWindowsTargeting=true

    - name: Publish product distribution
      shell: pwsh
      run: |
        $root = Join-Path $PWD 'staging\WDEM'
        $publish = Join-Path $PWD 'publish'
        New-Item -ItemType Directory -Force -Path $root, $publish | Out-Null

        dotnet publish src\Wdem.Cli\Wdem.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -m:1 -o (Join-Path $root 'Cli')
        if ($LASTEXITCODE -ne 0) { throw 'Publish failed: Wdem.Cli' }
        dotnet publish src\Wdem.Desktop\Wdem.Desktop.csproj -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -m:1 -o (Join-Path $root 'Desktop')
        if ($LASTEXITCODE -ne 0) { throw 'Publish failed: Wdem.Desktop' }
        dotnet publish src\Wdem.ElevatedHost\Wdem.ElevatedHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -m:1 -o (Join-Path $root 'ElevatedHost')
        if ($LASTEXITCODE -ne 0) { throw 'Publish failed: Wdem.ElevatedHost' }

        $expected = @(
            (Join-Path $root 'Cli\Wdem.Cli.exe'),
            (Join-Path $root 'Desktop\Wdem.Desktop.exe'),
            (Join-Path $root 'ElevatedHost\Wdem.ElevatedHost.exe')
        )
        foreach ($executable in $expected) {
            if (-not (Test-Path $executable -PathType Leaf)) {
                throw "Missing product host: $executable"
            }
        }

        Copy-Item THIRD-PARTY-NOTICES.md (Join-Path $root 'THIRD-PARTY-NOTICES.md')
        $archive = Join-Path $publish 'Wdem-win-x64.zip'
        Compress-Archive -Path (Join-Path $root '*') -DestinationPath $archive -Force
        Get-FileHash $archive -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  Wdem-win-x64.zip"
        } | Set-Content (Join-Path $publish 'SHA256SUMS.txt') -Encoding ascii
        Copy-Item THIRD-PARTY-NOTICES.md (Join-Path $publish 'THIRD-PARTY-NOTICES.md')

    - name: Create WDEM release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ inputs.tag_name || github.ref_name }}
        files: |
          publish\Wdem-win-x64.zip
          publish\SHA256SUMS.txt
          publish\THIRD-PARTY-NOTICES.md
        draft: false
        prerelease: false
        generate_release_notes: true
