name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore solution
      run: dotnet restore Wdem.sln

    - name: Build solution
      run: dotnet build Wdem.sln --no-restore -c Release

    - name: Test solution
      run: dotnet test Wdem.sln --no-build -c Release --verbosity normal

    - name: Report product release status
      shell: pwsh
      run: |
        Write-Host "Validated Wdem.sln. Product binary publishing is disabled until Wdem.Cli and Wdem.Desktop hosts exist."
