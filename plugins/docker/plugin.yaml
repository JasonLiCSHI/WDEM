name: docker-compose
version: 1.0.0

description: Manage Docker Compose CLI configuration settings (v2)

type: python
main: src/plugin.py
capabilities:
  - config_provider

install_info:
  default_manager: 'winget'
  packages:
    winget: 'Docker.DockerDesktop'
    scoop: 'docker-desktop'
    choco: 'docker-desktop'

